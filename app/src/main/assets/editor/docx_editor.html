<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes">
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <style>
        body { touch-action: manipulation; }
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: auto;
            -webkit-text-size-adjust: 100%;
        }
        #viewport-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            box-sizing: border-box;
            transform-origin: top center;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        #output {
            width: 100%;
            max-width: 900px;
        }
        .docx-wrapper {
            background: transparent !important;
            padding: 0 !important;
        }
        .docx, section.docx {
            margin: 0 auto 24px auto !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08) !important;
            border-radius: 8px !important;
            box-sizing: border-box !important;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        /* Comprehensive Dark Mode for DOCX */
        body.dark {
            background-color: #121212 !important;
            color: #e2e2e6 !important;
        }
        body.dark #viewport-wrapper {
            background-color: #121212 !important;
        }
        body.dark #output {
            background-color: #121212 !important;
        }
        body.dark .docx-wrapper {
            background: transparent !important;
            background-color: transparent !important;
        }
        body.dark .docx, 
        body.dark section.docx, 
        body.dark .docx-wrapper > section {
            background-color: #1e1e1e !important;
            color: #e2e2e6 !important;
            box-shadow: 0 4px 24px rgba(0,0,0,0.65) !important;
            border: 1px solid #333336 !important;
        }
        body.dark .docx *:not(mark.docx-highlight) {
            color: #e2e2e6 !important;
            border-color: #383838 !important;
        }
        body.dark .docx div,
        body.dark .docx p,
        body.dark .docx span {
            background-color: transparent !important;
        }
        body.dark .docx table,
        body.dark .docx td,
        body.dark .docx th {
            background-color: transparent !important;
            border-color: #444448 !important;
            color: #e2e2e6 !important;
        }
        body.dark .docx a {
            color: #88c0d0 !important;
        }
        /* Search Highlights */
        mark.docx-highlight {
            background-color: #ffe082 !important;
            color: #000000 !important;
            border-radius: 3px;
            padding: 1px 3px;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
        mark.docx-highlight-active {
            background-color: #ff9800 !important;
            color: #ffffff !important;
            outline: 2px solid #e65100;
        }
        .loading-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            font-size: 15px;
            font-weight: 500;
            color: #888;
        }
        .error-banner {
            padding: 20px;
            margin: 16px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            color: #d32f2f;
            font-size: 14px;
        }
        @media print {
            html, body, body.dark, body.dark #viewport-wrapper, body.dark #output { background: #ffffff !important; color: #141413 !important; }
            #viewport-wrapper { display: block; min-width: 0 !important; padding: 0; overflow: visible; }
            #output { zoom: 1 !important; width: 100% !important; max-width: none !important; }
            .docx, section.docx { margin: 0 auto !important; box-shadow: none !important; border-color: #d5d5d5 !important; break-after: page; }
            .docx:last-child, section.docx:last-child { break-after: auto; }
            body.dark .docx, body.dark section.docx { background: #ffffff !important; color: #141413 !important; }
            body.dark .docx *:not(mark.docx-highlight) { color: #141413 !important; border-color: #d5d5d5 !important; }
        }
    </style>
</head>
<body>
    <div id="viewport-wrapper">
        <div id="output">
            <div id="loading" class="loading-banner">Rendering Word document...</div>
        </div>
    </div>

    <script>
        let currentZoom = 1.0;
        let searchMatches = [];
        let currentMatchIdx = -1;
        let totalSearchMatches = 0;
        let searchMatchesTruncated = false;
        const maxSearchHighlights = 5000;

        function setZoom(factor) {
            const numericFactor = Number(factor);
            currentZoom = Math.min(Math.max(Number.isFinite(numericFactor) ? numericFactor : 1.0, 0.25), 5.0);
            const container = document.getElementById("output");
            if (container) {
                container.style.zoom = String(currentZoom);
                container.style.transformOrigin = "top center";
            }
            const wrapper = document.getElementById("viewport-wrapper");
            if (wrapper) {
                wrapper.style.minWidth = (currentZoom > 1.0 ? (currentZoom * 100) + "%" : "100%");
            }
        }

        let pageObserver = null;

        function setDarkMode(isDark) {
            document.body.classList.toggle('dark', Boolean(isDark));
            document.documentElement.classList.toggle('dark', Boolean(isDark));
        }

        function scrollToPage(pageNumber) {
            const pages = document.querySelectorAll('#output .docx');
            const page = pages[Math.max(0, Math.min(pages.length - 1, Number(pageNumber) - 1))];
            if (page) page.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function observePages() {
            if (pageObserver) pageObserver.disconnect();
            const pages = Array.from(document.querySelectorAll('#output .docx'));
            if (!pages.length || !('IntersectionObserver' in window)) return;
            pageObserver = new IntersectionObserver(function (entries) {
                const visible = entries.filter(entry => entry.isIntersecting);
                if (!visible.length) return;
                const center = (window.innerHeight || 0) / 2;
                visible.sort((a, b) => {
                    const rectA = a.boundingClientRect;
                    const rectB = b.boundingClientRect;
                    return Math.abs((rectA.top + rectA.bottom) / 2 - center) - Math.abs((rectB.top + rectB.bottom) / 2 - center);
                });
                const currentIndex = pages.indexOf(visible[0].target);
                if (window.Android && window.Android.onPageChanged && currentIndex >= 0) {
                    window.Android.onPageChanged(currentIndex + 1, pages.length);
                }
            }, { threshold: [0.15, 0.5, 0.85] });
            pages.forEach(page => pageObserver.observe(page));
        }

        let lastTapTime = 0;
        document.addEventListener('click', function (event) {
            const target = event.target && event.target.closest ? event.target.closest('a, button, input, textarea, select') : null;
            if (target || !window.Android) return;
            const now = Date.now();
            if (now - lastTapTime < 300) {
                // Double tap: toggle zoom (handled natively), suppress the second single tap.
                lastTapTime = 0;
                if (window.Android.onDocumentDoubleTap) window.Android.onDocumentDoubleTap();
            } else {
                lastTapTime = now;
                if (window.Android.onDocumentTap) window.Android.onDocumentTap();
            }
        });

        function notifySearchCount() {
            if (window.Android && window.Android.onSearchResultCount) {
                window.Android.onSearchResultCount(totalSearchMatches, currentMatchIdx, searchMatchesTruncated);
            }
        }

        function clearSearch() {
            document.querySelectorAll('mark.docx-highlight').forEach(el => {
                const parent = el.parentNode;
                if (parent) {
                    parent.replaceChild(document.createTextNode(el.textContent || ''), el);
                    parent.normalize();
                }
            });
            searchMatches = [];
            currentMatchIdx = -1;
            totalSearchMatches = 0;
            searchMatchesTruncated = false;
        }

        function searchWord(keyword) {
            clearSearch();
            const query = String(keyword || '').trim().toLowerCase();
            const container = document.getElementById("output");
            if (!query || !container) {
                notifySearchCount();
                return 0;
            }

            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                    const parent = node.parentElement;
                    if (!parent || !node.nodeValue || parent.closest('script, style, button, mark.docx-highlight')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);
            const foundMatches = [];
            let totalCount = 0;

            for (const node of textNodes) {
                const text = node.nodeValue || '';
                const lower = text.toLowerCase();
                let index = lower.indexOf(query);
                if (index < 0) continue;
                const fragment = document.createDocumentFragment();
                let last = 0;
                while (index >= 0) {
                    totalCount++;
                    fragment.appendChild(document.createTextNode(text.substring(last, index)));
                    if (foundMatches.length < maxSearchHighlights) {
                        const mark = document.createElement('mark');
                        mark.className = 'docx-highlight';
                        mark.textContent = text.substring(index, index + query.length);
                        fragment.appendChild(mark);
                        foundMatches.push(mark);
                    }
                    last = index + query.length;
                    index = lower.indexOf(query, last);
                }
                fragment.appendChild(document.createTextNode(text.substring(last)));
                if (node.parentNode) node.parentNode.replaceChild(fragment, node);
            }

            searchMatches = foundMatches;
            totalSearchMatches = totalCount;
            searchMatchesTruncated = totalCount > foundMatches.length;
            if (searchMatches.length > 0) highlightMatch(0);
            else notifySearchCount();
            return totalSearchMatches;
        }

        function highlightMatch(idx) {
            if (!searchMatches.length) {
                currentMatchIdx = -1;
                notifySearchCount();
                return 0;
            }
            currentMatchIdx = ((idx % searchMatches.length) + searchMatches.length) % searchMatches.length;
            searchMatches.forEach((match, index) => {
                match.className = index === currentMatchIdx
                    ? 'docx-highlight docx-highlight-active'
                    : 'docx-highlight';
            });
            searchMatches[currentMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            notifySearchCount();
            return currentMatchIdx + 1;
        }

        function nextSearchMatch() {
            return searchMatches.length ? highlightMatch(currentMatchIdx + 1) : 0;
        }

        function prevSearchMatch() {
            return searchMatches.length ? highlightMatch(currentMatchIdx - 1) : 0;
        }

        function loadDocx(base64, isDark) {
            setDarkMode(isDark);

            const container = document.getElementById("output");
            const loadingEl = document.getElementById("loading");

            if (typeof docx === 'undefined' || typeof JSZip === 'undefined') {
                const msg = "Document preview engine components could not be loaded.";
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner"><strong>Error:</strong> ' + msg + '</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError(msg);
                }
                return;
            }

            if (!base64 || base64.trim().length === 0) {
                if (window.Android && window.Android.getDocxBase64) {
                    try {
                        base64 = window.Android.getDocxBase64();
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            if (!base64 || base64.trim().length === 0) {
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner">Document data is empty or unavailable.</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError("Document data is empty");
                }
                return;
            }

            try {
                const binary_string = window.atob(base64);
                const len = binary_string.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binary_string.charCodeAt(i);
                }
                const arrayBuffer = bytes.buffer;

                const options = {
                    className: "docx",
                    inWrapper: true,
                    ignoreWidth: false,
                    ignoreHeight: false,
                    ignoreFonts: false,
                    breakPages: true,
                    ignoreLastRenderedPageBreak: false,
                    experimental: true,
                    trimXmlDeclaration: true,
                    debug: false
                };

                container.innerHTML = "";

                docx.renderAsync(arrayBuffer, container, null, options).then(function() {
                    const pages = container.querySelectorAll('.docx');
                    const totalPages = pages.length > 0 ? pages.length : 1;
                    // Loop 10: always reapply the authoritative zoom after a render.
                    // setZoom is idempotent at 1.0, and re-applying unconditionally closes
                    // the race where a zoom command that arrived during rendering was
                    // followed by a render pass that reset the visual size to 100%.
                    setZoom(currentZoom);
                    if (document.body.classList.contains('dark')) {
                        setDarkMode(true);
                    }
                    observePages();
                    if (window.Android && window.Android.onDocumentLoaded) {
                        window.Android.onDocumentLoaded(totalPages);
                    }
                }).catch(function(err) {
                    console.error("renderAsync error:", err);
                    container.innerHTML = '<div class="error-banner"><strong>DOCX Preview Notice:</strong> Could not render formatted layout (' + (err ? err.toString() : 'Unknown error') + ').</div>';
                    if (window.Android && window.Android.onDocumentError) {
                        window.Android.onDocumentError(err ? err.toString() : "Render failed");
                    }
                });
            } catch (err) {
                console.error("loadDocx catch:", err);
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner"><strong>DOCX Parsing Error:</strong> ' + (err ? err.toString() : 'Invalid file format') + '</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError(err ? err.toString() : "Parse failed");
                }
            }
        }

    </script>
</body>
</html>
