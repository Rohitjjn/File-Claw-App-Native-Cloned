<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes">
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #output {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 16px;
            box-sizing: border-box;
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-overflow-scrolling: touch;
        }
        .docx-wrapper {
            background: transparent !important;
            padding: 0 !important;
        }
        .docx {
            margin: 0 auto !important;
            max-width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08) !important;
            border-radius: 8px !important;
            transform-origin: top center;
        }
        /* Keep Word pages readable when zoomed out and avoid horizontal clipping. */
        #output.fit-page .docx-wrapper { width: 100% !important; }
        #output.fit-page .docx {
            width: min(100%, 816px) !important;
            min-width: 0 !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        #output.fit-page section, #output.fit-page article {
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        body.dark .docx {
            background-color: #1e1e1d !important;
            color: #f5f5f3 !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3) !important;
        }
        body.dark .docx p, body.dark .docx span, body.dark .docx div,
        body.dark .docx td, body.dark .docx th, body.dark .docx li,
        body.dark .docx h1, body.dark .docx h2, body.dark .docx h3,
        body.dark .docx h4, body.dark .docx h5, body.dark .docx h6 {
            color: #e0deda !important;
        }
        body.dark .docx table, body.dark .docx td, body.dark .docx th {
            border-color: #555 !important;
        }
        body.dark .docx [style*="background-color: rgb(255, 255, 255)"],
        body.dark .docx [style*="background-color:#fff"],
        body.dark .docx [style*="background-color: #fff"] {
            background-color: #1e1e1d !important;
        }
        .loading-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            font-size: 14px;
            color: #888;
        }
        .error-banner {
            padding: 20px;
            margin: 16px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            color: #d32f2f;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="output">
        <div id="loading" class="loading-banner">Rendering Word document...</div>
    </div>

    <script>
        window.scrollToHeading = function(index, expectedTitle) {
            var output = document.getElementById('output');
            if (!output) return;
            var headings = output.querySelectorAll('h1, h2, h3, h4, h5, h6, [class*="Heading"], [class*="heading"]');
            var normalize = function(value) {
                return (value || '').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
            };
            var wanted = normalize(expectedTitle);
            var target = null;
            if (wanted) {
                for (var i = 0; i < headings.length; i++) {
                    if (normalize(headings[i].textContent) === wanted) {
                        target = headings[i];
                        break;
                    }
                }
            }
            // Ordinal is a compatibility fallback if the renderer exposes no matching heading text.
            if (!target) target = headings[index];
            if (target && typeof target.scrollIntoView === 'function') {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        // The native WebView can call these functions from its toolbar.
        // Fit-to-page is reversible and does not mutate document data.
        window.setDocxFitPage = function(enabled) {
            var output = document.getElementById('output');
            if (output) output.classList.toggle('fit-page', !!enabled);
            if (output) output.scrollLeft = 0;
        };
        window.setDocxDarkMode = function(enabled) {
            document.body.classList.toggle('dark', !!enabled);
        };

        function loadDocx(base64, isDark) {
            if (isDark) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }

            const container = document.getElementById("output");
            const loadingEl = document.getElementById("loading");

            if (typeof docx === 'undefined' || typeof JSZip === 'undefined') {
                const msg = "Document preview engine components could not be loaded.";
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner"><strong>Error:</strong> ' + msg + '</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError(msg);
                }
                return;
            }

            if (!base64 || base64.trim().length === 0) {
                if (window.Android && window.Android.getDocxBase64) {
                    try {
                        base64 = window.Android.getDocxBase64();
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            if (!base64 || base64.trim().length === 0) {
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner">Document data is empty or unavailable.</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError("Document data is empty");
                }
                return;
            }

            try {
                // Decode base64 to binary array
                const binary_string = window.atob(base64);
                const len = binary_string.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binary_string.charCodeAt(i);
                }
                const arrayBuffer = bytes.buffer;

                const options = {
                    className: "docx",
                    inWrapper: true,
                    ignoreWidth: false,
                    ignoreHeight: false,
                    ignoreFonts: false,
                    breakPages: true,
                    ignoreLastRenderedPageBreak: false,
                    experimental: true,
                    trimXmlDeclaration: true,
                    debug: false
                };

                container.innerHTML = "";

                docx.renderAsync(arrayBuffer, container, null, options).then(function() {
                    if (window.Android && window.Android.onDocumentLoaded) {
                        window.Android.onDocumentLoaded(1);
                    }
                }).catch(function(err) {
                    console.error("renderAsync error:", err);
                    container.innerHTML = '<div class="error-banner"><strong>DOCX Preview Notice:</strong> Could not render formatted layout (' + (err ? err.toString() : 'Unknown error') + ').</div>';
                    if (window.Android && window.Android.onDocumentError) {
                        window.Android.onDocumentError(err ? err.toString() : "Render failed");
                    }
                });
            } catch (err) {
                console.error("loadDocx catch:", err);
                if (loadingEl) loadingEl.style.display = 'none';
                container.innerHTML = '<div class="error-banner"><strong>DOCX Parsing Error:</strong> ' + (err ? err.toString() : 'Invalid file format') + '</div>';
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError(err ? err.toString() : "Parse failed");
                }
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (window.Android && window.Android.getDocxBase64) {
                try {
                    const b64 = window.Android.getDocxBase64();
                    if (b64 && b64.length > 0) {
                        const isDark = document.body.classList.contains('dark') || false;
                        loadDocx(b64, isDark);
                    }
                } catch (e) {
                    console.log("Waiting for evaluateJavascript call");
                }
            }
        });
    </script>
</body>
</html>
