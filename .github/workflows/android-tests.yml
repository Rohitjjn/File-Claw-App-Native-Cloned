name: Android Tests & Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/loop-6-reader-polish
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit tests, coverage, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "::error::Android SDK cmdline-tools not found at $SDKMANAGER"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Report toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Verify core coverage
        run: ./gradlew :app:jacocoCoreReport :app:jacocoCoreVerify --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run Detekt
        run: ./gradlew :app:detekt --stacktrace --no-daemon

      - name: Run compile_applet when configured
        shell: bash
        run: |
          set -euo pipefail
          TASKS_FILE="$(mktemp)"
          ./gradlew tasks --all --console=plain --no-daemon | tee "$TASKS_FILE"
          if grep -Eq '(^|[[:space:]])compile_applet([[:space:]-]|$)' "$TASKS_FILE"; then
            ./gradlew compile_applet --stacktrace --no-daemon
            echo "- compile_applet: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::compile_applet is not defined by this Gradle build; skipped."
            echo "- compile_applet: not defined by this Gradle build (skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$TASKS_FILE"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload test, coverage, lint and APK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-claw-verification-reports-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/jacoco/**
            app/build/reports/coverage/**
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk

      - name: Summarize verification
        if: always()
        shell: bash
        run: |
          {
            echo "## File Claw Android verification"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Unit tests, coverage, lint and APK: see preceding steps and uploaded reports"
          } >> "$GITHUB_STEP_SUMMARY"
