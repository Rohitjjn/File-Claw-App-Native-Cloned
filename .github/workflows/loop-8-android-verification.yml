name: Loop 8 Android Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/loop-8-android-verification.yml'
  push:
    branches: [feat/loop-8-document-preview-polish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-8-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      - name: Run app unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-8-test-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14

  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: file-claw-loop-8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
