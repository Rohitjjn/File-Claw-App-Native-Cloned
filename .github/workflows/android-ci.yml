name: Android CI (verify, no release)

# Compiles, tests and assembles every push to agent branches and every PR into main.
# It never publishes a GitHub Release or tag (that stays in build-and-release.yml).
on:
  push:
    branches:
      - 'arena/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-js:
    name: Reader runtime tests (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reader.js tests
        working-directory: tools/reader-js-tests
        run: |
          npm install --no-audit --no-fund
          npm test

  android:
    name: Unit tests + debug/release build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null || true; fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        env:
          READER_FIXTURE_DIR: ${{ github.workspace }}/build/reader-fixtures
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee gradle-test.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Markdown/TXT save round trip (Kotlin pages in jsdom)
        run: |
          set -o pipefail
          cd tools/reader-js-tests
          npm install --no-audit --no-fund > /dev/null
          node roundtrip.js "$GITHUB_WORKSPACE/build/reader-fixtures" 2>&1 | tee "$GITHUB_WORKSPACE/roundtrip.log"

      - name: Assemble debug and release (R8 + lint vital)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Summarise results
        if: success()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0)); failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0)); skipped += int(root.get("skipped", 0))
          print("::notice title=Unit tests::%d tests, %d failures, %d errors, %d skipped" % (tests, failures, errors, skipped))
          try:
              last = [l.strip() for l in open("roundtrip.log") if l.startswith("round trip")][-1]
              print("::notice title=Save round trip::" + last)
          except (OSError, IndexError):
              pass
          PY

      - name: Report failures as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          def emit(title, lines):
              if not lines:
                  return
              chunk, size, count = [], 0, 0
              for line in lines:
                  line = line.rstrip()[:400]
                  if size + len(line) > 3500 and chunk:
                      print("::error title=%s::%s" % (title, "%0A".join(chunk)))
                      count += 1
                      chunk, size = [], 0
                      if count >= 4:
                          return
                  chunk.append(line.replace('%', '%25').replace('\r', ''))
                  size += len(line) + 3
              if chunk:
                  print("::error title=%s::%s" % (title, "%0A".join(chunk)))

          compile_errors = []
          for log in ("gradle-test.log", "gradle-build.log"):
              if not os.path.exists(log):
                  continue
              for line in open(log, errors="replace"):
                  if line.startswith("> Task") and "FAILED" not in line:
                      continue
                  if re.match(r"^e: ", line) or "error:" in line or line.startswith("> ") or "What went wrong" in line:
                      compile_errors.append(line.replace(os.getcwd() + "/", ""))
          emit("Gradle errors", compile_errors[:120])

          if os.path.exists("roundtrip.log"):
              lines = [l for l in open("roundtrip.log", errors="replace") if l.startswith(("FAIL", "  expected", "  actual", "round trip"))]
              emit("Round trip failures", lines[:60])

          failures = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.get("message") or failure.text or "").strip().splitlines()
                      failures.append("%s.%s: %s" % (case.get("classname"), case.get("name"), " | ".join(message[:3])[:350]))
          emit("Unit test failures", failures[:60])
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: files-claw-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
